<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToN Pin Map</title><link rel="stylesheet" href="style.css"></head><body>
<div id="noroom" class="modal hidden"><div class="card"><div class="eyebrow">TERRORS OF NOWHERE</div><h1>Instance not detected</h1><p>このページはローカル監視ツールから開いてください。同じToNインスタンスの参加者は自動で同じ部屋に入ります。</p></div></div>
<div id="login" class="modal"><div class="card"><div class="eyebrow">TERRORS OF NOWHERE</div><h1>Pin Map</h1><p>マップ上に表示する名前を入力してください。</p><input id="name" maxlength="32" placeholder="Display name"><button id="enter" class="primary">ENTER</button></div></div>
<header><div class="brand"><span class="mark"></span><div><b id="mapTitle">Waiting for ToN log…</b><span id="round"></span></div></div><div class="user"><span id="roomStatus">INSTANCE SYNC</span><span id="me"></span><button id="rename">名前変更</button></div></header>
<div id="toolbar"><div class="toolgroup"><span class="tool-label">POSITION</span><button class="color active" data-color="red"><i class="red"></i>チェイス</button><button class="color" data-color="green"><i class="green"></i>生存希望</button><button class="color" data-color="blue"><i class="blue"></i>その他ポジション</button></div><div class="divider"></div><div class="toolgroup sizegroup"><span class="tool-label">PIN SIZE</span><input id="pinSize" type="range" min="16" max="52" value="26"><output id="pinSizeValue">26</output></div><div class="divider"></div><button id="clearMine" class="danger">ピンを削除</button></div>
<main><div id="stage"><div id="mapLayer"><img id="map" draggable="false"><div id="pins"></div></div><div id="missing">MAP IMAGE NOT AVAILABLE</div></div></main>
<div class="hint">マップをクリック：自分のピンを配置 / 移動　・　1人1ピン　・　同じVRChatインスタンス内で自動同期</div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
